<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA Maestra</title>
<style>
body{background:#0a0a1a;color:#fff;font-family:monospace;padding:20px;max-width:700px;margin:auto}
#chat{border:1px solid #0ff;height:400px;overflow-y:auto;padding:10px;margin-bottom:10px}
input{width:80%;padding:10px;background:#111;color:#0ff;border:1px solid #0ff}
button{padding:10px;background:#0ff;color:#000;border:none}
a{color:#0ff}
.msg{margin:8px 0}
.user{color:#ff0} .bot{color:#0ff}
</style>
</head>
<body>
<h1>IA Maestra</h1>
<a href="/laboratorio">Ir a Laboratorio de Neuronas (crear cerebro)</a>
<div id="chat"></div>
<input id="msg" placeholder="Escribe...">
<button onclick="enviar()">Enviar</button>
<script>
async function enviar(){
 let m=document.getElementById('msg').value;
 if(!m)return;
 let chat=document.getElementById('chat');
 chat.innerHTML+=`<div class='msg user'>Tu: ${m}</div>`;
 document.getElementById('msg').value='';
 let res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
 let data=await res.json();
 chat.innerHTML+=`<div class='msg bot'>IA: ${data.reply}</div>`;
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
