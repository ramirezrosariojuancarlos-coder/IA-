<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA Maestra - Julio</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a237e">
<style>
body{font-family:Arial; background:#0f0f0f; color:white; margin:0; padding:15px; display:flex; justify-content:center}
.box{width:100%; max-width:600px; background:#1a237e; border:2px solid #536dfe; border-radius:15px; padding:15px; display:flex; flex-direction:column; height:85vh}
.chat{flex:1; overflow-y:auto; background:#f5f5ff; border-radius:10px; padding:12px; margin:10px 0; display:flex; flex-direction:column; gap:8px}
.msg{margin:0; padding:10px 14px; border-radius:18px; max-width:85%; word-wrap:break-word; font-size:15px; line-height:1.3}
.user{background:#536dfe; color:white; align-self:flex-end; border-bottom-right-radius:4px}
.bot{background:white; color:#1a1a1a; align-self:flex-start; border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,0.2)}
.input-area{display:flex; gap:8px}
input{flex:1; padding:14px; border-radius:25px; border:none; outline:none; font-size:15px}
button{padding:14px 22px; border-radius:25px; border:none; font-weight:bold; cursor:pointer; background:#536dfe; color:white}
h3{text-align:center; margin:0 0 5px 0; letter-spacing:1px}
</style>
</head>
<body>
<div class="box">
  <h3>IA MAESTRA</h3>
  <div class="chat" id="chat"></div>
  <div class="input-area">
    <input id="input" placeholder="Escribe aqui...">
    <button onclick="enviar()">Enviar</button>
  </div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
async function enviar(){
  let inp = document.getElementById('input');
  let chat = document.getElementById('chat');
  let texto = inp.value.trim(); if(!texto) return;
  chat.innerHTML += `<div class="msg user">${texto}</div>`; inp.value='';
  chat.scrollTop = chat.scrollHeight;
  let res = await fetch('/chat',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:texto})});
  let data = await res.json();
  chat.innerHTML += `<div class="msg bot">${data.reply}</div>`;
  chat.scrollTop = chat.scrollHeight;
}
document.getElementById('input').addEventListener('keypress', e=>{if(e.key==='Enter') enviar()});
</script>
</body>
</html>
