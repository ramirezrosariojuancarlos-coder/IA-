<!DOCTYPE html>
<html>
<head><title>Lab Postgres</title></head>
<body>
<script>
let cerebro = {"neuronas":[]};

// 1. Al entrar, carga de Postgres y de respaldo local
async function cargar() {
  try {
    let r = await fetch('/api/cerebro');
    cerebro = await r.json();
    localStorage.setItem('mi_cerebro_backup', JSON.stringify(cerebro));
  } catch(e) {
    // Si falla Postgres, usa el respaldo local
    let backup = localStorage.getItem('mi_cerebro_backup');
    if(backup) cerebro = JSON.parse(backup);
  }
  render();
}

// 2. Al guardar, guarda en los 2 lados
async function guardar() {
  localStorage.setItem('mi_cerebro_backup', JSON.stringify(cerebro));
  await fetch('/api/cerebro', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(cerebro)
  });
  render();
}

function render(){
  document.getElementById('cerebro').innerText = JSON.stringify(cerebro, null, 2);
}

cargar();
</script>
<pre id="cerebro"></pre>
</body>
</html>
